version: 1
name: bsc-webui
root: ..
timeout_seconds: 120
no_external_dependencies_reason: "The BSC WebUI acceptance suite uses local fixtures and fake transports; live GeckoTerminal/RPC smoke is explicitly separate."
checks:
  - id: unit-tests
    command: ["/Users/mashengyu/miniforge3/envs/codex-engineering/bin/python", "-m", "pytest", "-p", "no:cacheprovider", "-q"]
    expected_exit_code: 0
    stdout_contains: ["passed"]
    stdout_not_contains: ["FAILED", "ERROR"]
  - id: compile
    command: ["/Users/mashengyu/miniforge3/envs/codex-engineering/bin/python", "-m", "compileall", "-q", "src", "tests", "scripts"]
    expected_exit_code: 0
    stdout_not_contains: ["Traceback", "Error"]
  - id: security-boundary
    command: ["/Users/mashengyu/miniforge3/envs/codex-engineering/bin/python", "scripts/check_security.py"]
    expected_exit_code: 0
    stdout_contains: ["security_boundary_ok"]
    stdout_not_contains: ["forbidden"]
